<!DOCTYPE html>
<html lang="vi">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Blog for notes </title>
	<link rel="stylesheet" href="style.css">
    <link rel="icon" href="chad.png" type="image/x-icon">
</head>
<body>
	<div class="app-shell">
		<aside>
			<div class="brand" id="brandHome" role="button" tabindex="0" title="Tổng quan"><div class="brand-mark">✦</div><div><strong>MY SPACE</strong><small>Have a nice day!</small></div></div>
			<p class="side-label">All tabs</p>
			<nav id="tabList" aria-label="Các tab"></nav>
			<button class="new-tab" id="newTabButton" type="button">＋ <span>New tab (+) </span></button>
			<p class="aside-note">Tạo những notes cho công việc, học tập.</p>
		</aside>
		<main>
			<div class="topbar"><b id="currentTabName">Tổng quan</b></div><div class="theme-switcher" aria-label="Chọn theme"><button class="theme-button active" data-theme-choice="light" title="Theme sáng" type="button">☀ Sáng</button><button class="theme-button" data-theme-choice="dark" title="Theme tối" type="button">◐ Tối</button><button class="theme-button" data-theme-choice="glass" title="Theme blur trong suốt" type="button">◌ Blur</button></div><div class="date" id="today"></div></div>
			<section class="hero">
				<div><h1> Hello bro :> </em>.</h1><p> Gom các đường dẫn, ghi chú.</p></div>
				<button class="add-link-button" id="addLinkButton" type="button">＋ Thêm đường dẫn</button>
			</section>
			<div class="content-grid">
				<section class="panel"><div class="panel-header"><h2>Đường dẫn đã lưu</h2><span class="count" id="linkCount"></span></div><div id="linkGrid"></div></section>
				<section class="panel notes" id="notesPanel"></section>
			</div>
		</main>
	</div>

	<dialog id="linkDialog"><form class="dialog-body" id="linkForm"><h2>Thêm đường dẫn</h2><label class="field">Tên hiển thị<input id="linkTitle" required placeholder="Ví dụ: Tài liệu dự án"></label><label class="field">Địa chỉ URL<input id="linkUrl" type="url" required placeholder="https://example.com"></label><div class="dialog-actions"><button class="cancel" type="button" data-close>Hủy</button><button class="add-link-button" type="submit">Thêm vào tab</button></div></form></dialog>
	<dialog id="tabDialog"><form class="dialog-body" id="tabForm"><h2>New tab</h2><label class="field">Tên tab<input id="tabName" required maxlength="24" placeholder="Ví dụ: Học tập"></label><div class="field"><span>Biểu tượng đang chọn</span><input id="tabIcon" maxlength="2" value="◈" readonly><div class="icon-picker" aria-label="Chọn biểu tượng"><button class="icon-choice selected" data-icon="◈" type="button">◈</button><button class="icon-choice" data-icon="⌂" type="button">⌂</button><button class="icon-choice" data-icon="★" type="button">★</button><button class="icon-choice" data-icon="♥" type="button">♥</button><button class="icon-choice" data-icon="✎" type="button">✎</button><button class="icon-choice" data-icon="✦" type="button">✦</button><button class="icon-choice" data-icon="✧" type="button">✧</button><button class="icon-choice" data-icon="☀" type="button">☀</button><button class="icon-choice" data-icon="☕" type="button">☕</button><button class="icon-choice" data-icon="⚙" type="button">⚙</button><button class="icon-choice" data-icon="⚡" type="button">⚡</button><button class="icon-choice" data-icon="✓" type="button">✓</button><button class="icon-choice" data-icon="▣" type="button">▣</button><button class="icon-choice" data-icon="◉" type="button">◉</button><button class="icon-choice" data-icon="◇" type="button">◇</button><button class="icon-choice" data-icon="♬" type="button">♬</button><button class="icon-choice" data-icon="♟" type="button">♟</button><button class="icon-choice" data-icon="☁" type="button">☁</button><button class="icon-choice" data-icon="✈" type="button">✈</button><button class="icon-choice" data-icon="⌘" type="button">⌘</button><button class="icon-choice" data-icon="▤" type="button">▤</button><button class="icon-choice" data-icon="⚑" type="button">⚑</button><button class="icon-choice" data-icon="♧" type="button">♧</button><button class="icon-choice" data-icon="∞" type="button">∞</button></div></div><div class="dialog-actions"><button class="cancel" type="button" data-close>Hủy</button><button class="add-link-button" type="submit">Tạo tab</button></div></form></dialog>

	<script src="script.js"></script>
</body>
</html>
